<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>
    <link rel="icon" href="/imgfav/favicon.webp" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700;800&display=block"
    />
    <style>
      /* Shown until the dealer's data is in and the page mounts (replaced by the app). */
      #boot { position: fixed; inset: 0; display: grid; place-items: center; background: #fafafc; }
      #boot span { width: 40px; height: 40px; border: 3px solid #e6e4ef; border-top-color: #6b7280; border-radius: 50%;
        animation: boot-spin .8s linear infinite; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="app"><div id="boot" aria-hidden="true"><span></span></div></div>
    <script type="module" src="/app/main.ts"></script>
  </body>
</html>
